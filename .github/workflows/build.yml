name: Build

on:
  push:
    branches: ['**']
    tags: ['*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - uses: actions/upload-artifact@v4
        with:
          name: Werewolf-${{ github.sha }}
          path: |
            plugin/target/Werewolf-*.jar
            api/target/werewolf-api-*.jar
          if-no-files-found: error

      # The jar is compiled against the newest Paper API; check it only references what the oldest supported Spigot has
      - name: Check the jar links against the oldest supported Spigot
        run: |
          mvn -B -q -pl api dependency:build-classpath -Dmdep.outputFile=target/spigot.classpath
          java ci/LinkCheck.java plugin/target/Werewolf-*.jar "$(cat api/target/spigot.classpath)"

  # Pushing a tag like 1.0.0 publishes a GitHub release with the plugin and API jars attached.
  # The tag has to match <version> in pom.xml. JitPack builds the API from the same tag.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check tag matches pom version
        run: |
          version=$(mvn -B -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom.xml version $version"
            exit 1
          fi

      - name: Build
        run: mvn -B clean package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "plugin/target/Werewolf-$GITHUB_REF_NAME.jar" "api/target/werewolf-api-$GITHUB_REF_NAME.jar" --title "v$GITHUB_REF_NAME" --generate-notes
