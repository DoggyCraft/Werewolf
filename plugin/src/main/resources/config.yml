# Werewolf configuration
#
# Missing keys fall back to the defaults shown here, so you only need to keep the settings you change.
# Use /ww reload to apply changes without restarting.
# Chances written as 0.0 - 1.0 are probabilities (0.25 = 25%). Chances written as 0 - 100 are percentages.

# Used by the plugin to upgrade old configs. Do not change.
config-version: 2

Settings:
  # Name shown in messages that mention the server
  ServerName: Your Server
  # Language file in plugins/Werewolf/lang/ (english, danish, ...). Missing files are downloaded on start
  Language: english
  # Log extra information to the console
  Debug: false
  # Werewolves only transform at night when the moon is full. If false they transform every night
  OnlyTransformDuringFullMoon: true
  # Drop armor and the held item when transforming. If false they are moved into the inventory where possible
  DropArmorOnTransform: true
  # Show werewolf names in death messages
  RenameWerewolves: true
  # Werewolves sometimes get messages about their urges
  WerewolfUrges: true
  # Chat from werewolves in wolf form is turned into growls for non-werewolves
  WolfChat: true
  # Cure a werewolf when they are killed in wolf form
  CureWerewolfWhenSlain: false
  # Randomly add money to the werewolf bounty while werewolves roam (needs Vault)
  AutoBounty: false
  # The bounty AutoBounty stops adding at
  AutoBountyMaximum: 1000

# Worlds werewolves exist in. Leave empty to use the server's main world
AllowedWorlds: []

# Night in world ticks (0 - 24000). Werewolves transform between Start and End
Night:
  Start: 13000
  End: 23000

Moon:
  # Display names for the moon phases
  PhaseNames:
    FullMoon: Full Moon
    WaningGibbous: Waning Gibbous
    LastQuarter: Last Quarter
    WaningCrescent: Waning Crescent
    NewMoon: New Moon
    WaxingCrescent: Waxing Crescent
    FirstQuarter: First Quarter
    WaxingGibbous: Waxing Gibbous

Werewolf:
  # Damage a werewolf deals with bare hands (in half hearts). Default for Stats.<clan>.FistDamage
  HandDamage: 8.0
  # Damage a werewolf deals with an item in hand. Default for Stats.<clan>.ItemDamage
  ItemDamage: 3.0
  # Multiplier on damage a werewolf takes (0.8 = takes 80%). Default for Stats.<clan>.Defense
  ArmorMultiplier: 0.8
  # Radius (blocks) in which wild wolves can join a werewolf's pack
  WolfDistance: 10
  # Wolf form stats per clan (WildBite = Silvermane, WerewolfBite = Bloodmoon, Potion = Witherfang).
  # Speed is the walk speed (-1.0 - 1.0, players walk at 0.2). Defense is the damage taken multiplier.
  # A missing value uses the global value above (alphas: double damage, half the damage taken)
  Stats:
    WildBite:
      Speed: 0.5
      Defense: 0.8
      FistDamage: 8.0
      ItemDamage: 3.0
      Alpha:
        Speed: 0.5
        Defense: 0.4
        FistDamage: 16.0
        ItemDamage: 6.0
    WerewolfBite:
      Speed: 0.5
      Defense: 0.8
      FistDamage: 8.0
      ItemDamage: 3.0
      Alpha:
        Speed: 0.5
        Defense: 0.4
        FistDamage: 16.0
        ItemDamage: 6.0
    Potion:
      Speed: 1.0
      Defense: 0.8
      FistDamage: 8.0
      ItemDamage: 3.0
      Alpha:
        Speed: 1.0
        Defense: 0.4
        FistDamage: 16.0
        ItemDamage: 6.0
  # Potion effects in wolf form per clan, as EFFECT:amplifier:duration_in_ticks (amplifier 0 = level I).
  # Effect names are Minecraft ids such as speed, jump_boost, strength or night_vision
  Effects:
    WildBite:
    - HUNGER:1:32000
    - NIGHT_VISION:0:32000
    - JUMP_BOOST:1:32000
    - REGENERATION:0:32000
    WerewolfBite:
    - HUNGER:1:32000
    - NIGHT_VISION:0:32000
    - JUMP_BOOST:1:32000
    - STRENGTH:1:32000
    Potion:
    - HUNGER:1:32000
    - NIGHT_VISION:0:32000
    - JUMP_BOOST:2:32000
  # Potion effects removed from werewolves in wolf form (unless their clan's Effects give it)
  BlockedPotions: []

# Commands werewolves cannot use. "/plugin:command" is matched as "/command" too.
# Players with werewolf.bypass.blockedcommands are not affected
BlockedCommands:
  # Blocked for every werewolf
  All: []
  # Blocked in wolf form
  WolfForm:
  - /skin
  - /skins
  # Blocked for clan alphas
  Alpha: []

# Werewolves only eat meat
Diet:
  Enabled: true
  # Cancel eating a blocked food. If false they can eat it but get no hunger back
  PreventConsumption: true
  # Also apply the diet in human form
  HumanForm: false
  # Material names of the foods werewolves cannot eat
  BlockedFoods:
  - APPLE
  - BREAD
  - PUMPKIN
  - MELON
  - MUSHROOM_STEW
  - BEETROOT_SOUP
  - BEETROOT
  - BAKED_POTATO
  - PUMPKIN_PIE
  - POTATO
  - POISONOUS_POTATO
  - GOLDEN_APPLE
  - ENCHANTED_GOLDEN_APPLE
  - DRIED_KELP
  - CAKE
  - COOKIE
  - CARROT
  - MILK_BUCKET
  - GOLDEN_CARROT
  - SUSPICIOUS_STEW
  - CHORUS_FRUIT
  - MELON_SLICE
  - SWEET_BERRIES
  - GLOW_BERRIES
  - HONEY_BOTTLE

Infection:
  # Chance (0.0 - 1.0) that drinking a cure potion cures a werewolf
  CureChance: 1.0
  # Chance (0.0 - 1.0) that a werewolf's bite infects a player. 0 turns werewolf bites off
  WerewolfBiteRisk: 0.05
  # Chance (0.0 - 1.0) that a bite infects when the werewolf has used /ww intent
  WerewolfBiteIntentRisk: 0.25
  # Chance (0.0 - 1.0) that a wild wolf's bite infects a player
  WildWolfBiteRisk: 0.75
  # Werewolves who have not transformed for this many days are cured. 0 turns this off
  AutoCureDays: 14

# Number of transformations (levels) a werewolf needs for each perk
Maturity:
  # Can use /ww intent to choose whether a bite infects
  Intent: 2
  # Keeps their items when transforming
  NoDropItems: 3
  # Can sniff and follow a player's scent
  ScentTrack: 5
  # Can transform at will with /ww transform
  ControlledTransformation: 7
  # No longer hurt by gold
  GoldImmunity: 10

# How long a /ww transform wolf form lasts
Transformation:
  # Limit the time. If false a controlled transformation lasts until the werewolf ends it
  Limit: true
  # LINEAR: Base + Modifier * level. EXPONENTIAL: Base + level ^ Modifier. CONSTANT: Base
  Equation: LINEAR
  # Seconds
  Base: 300.0
  Modifier: 30.0

# Cooldowns in seconds. 0 turns a cooldown off
Cooldowns:
  # Between /ww transform form changes
  Transform: 600
  Howl: 60
  Growl: 30
  # Between attempts to sniff a player's scent
  Sniff: 5

# Scent tracking for mature werewolves
Scent:
  # Chance (0 - 100) that a sniff picks up the scent
  Chance: 10
  # Length of the particle trail in blocks. 0 hides the trail
  Range: 8
  # Height offset of the trail
  YOffset: 0.0
  # Particles per trail block
  ParticleAmount: 10
  # Distances (blocks) where the trail changes color. Keep them in descending order
  Distances:
    Far: 500
    Close: 200
    VeryClose: 50
  # Slowness amplifier while following a scent. -1 gives no slowness
  SlownessAmplifier: 2

# Werewolf hunting: trackers and hunting gear
Hunting:
  Enabled: true
  Trackers:
    # Trackers also work in the off hand
    UseEitherHand: true
  # When trackers point at a target
  Target:
    Werewolf:
      WolfForm: true
      HumanForm: false
      Daytime: false
      Nighttime: true
    Vampire:
      Daytime: false
      Nighttime: true
  # Turn PvP on for werewolves trespassing in claims (needs GriefPrevention and PvPManager)
  ForcePvP:
    Enabled: false
    Claims: true
    AdminClaims: false

# Respect protection from these plugins when they are installed
Integrations:
  WorldGuard: true
  PvPManager: true
  GriefPrevention: true

Items:
  # Damage multiplier of the silver sword against werewolves
  SilverSwordMultiplier: 2
  # Damage per second a werewolf takes while holding a silver sword. 0 turns this off
  SilverSwordPenalty: 2.0
  # Silver sword hits ignore a werewolf's Defense
  SilverSwordBypassesDefense: true
  # Chance (0 - 100) that wolfbane turns a werewolf in wolf form back to human
  WolfbaneUntransformChance: 25
  # Which items can be crafted
  CraftableSilverSword: true
  CraftableSilverArmor: true
  CraftableLoreBookEnabled: true
  CraftableInfectionPotionEnabled: true
  CraftableCurePotionEnabled: true
  CraftableWolfbanePotionEnabled: true
  CraftableWerewolfTracker: true
  CraftableVampireTracker: true
  # Per piece. Purity: chance (0 - 100, summed over worn pieces) to block an infection.
  # Defense: percentage (0 - 100, summed) less damage taken from werewolves and vampires
  SilverArmor:
    Helmet:
      Purity: 10
      Defense: 8
    Chestplate:
      Purity: 45
      Defense: 20
    Leggings:
      Purity: 35
      Defense: 14
    Boots:
      Purity: 10
      Defense: 8

# Werewolf shop signs (needs Vault)
Signs:
  Enabled: false
  CurePrice: 500.0
  InfectionPrice: 1000.0
  WolfbanePrice: 250.0
  SilverSwordPrice: 1000.0
  BookPrice: 100.0

# Random names given to werewolves in wolf form
WerewolfNames:
  Enabled: true
  Given_names:
  - Dark
  - Black
  - White
  - Red
  - Blood
  - Blue
  - Gray
  - Neon
  - Wild
  - Lurking
  - Feral
  - Bestial
  - Fierce
  - Vicious
  - Bloodthirsty
  - Fearsome
  - Ghoulish
  - Wrathful
  - Teenage
  - Savage
  Surnames:
  - Devourer
  - Fang
  - Wolf
  - Howl
  - Turned
  - Ghoul
  - Paws
  - Claw

# Move werewolves to this permission group while in wolf form (needs Vault)
WerewolfGroup:
  Enabled: false
  Name: Werewolf

Trophies:
  # Killing a werewolf in wolf form with a sword drops their head as a trophy
  Enabled: false

Scoreboards:
  Enabled: true

Chat:
  Prefix: Werewolf

Disguises:
  # Skin backend: auto, builtin (Paper only), libsdisguises or skinsrestorer.
  # auto picks builtin on Paper, otherwise LibsDisguises, then SkinsRestorer
  Backend: auto

Clans:
  Enabled: true
  # Clan display names
  PotionName: Witherfang
  WerewolfBiteName: Bloodmoon
  WildBiteName: Silvermane
  # Skins: the Minecraft account each skin comes from, and its texture value and signature
  # (from https://sessionserver.mojang.com/session/minecraft/profile/<uuid>?unsigned=false)
